# DVC Pipeline for BharatHealth Analyst Data Processing
#
# 3 real stages matching what the scripts actually do (an earlier version had 7
# stages referencing CLI flags and a backend/data/raw/ directory that never
# existed — pipeline.py and build_index.py don't take flags at all, and the raw
# source files live in dataset/, not a separate raw/ staging copy).
#
# clean_data and merge_trends are combined into one stage because
# nfhs4_integration.py enriches nfhs5_clean.parquet *in place* by design (single
# source of truth, so every tool/query reads one file) — DVC doesn't allow two
# stages to both own the same output path, so splitting them would mean either
# faking a duplicate file or fighting the pipeline's actual, tested design.

stages:
  build_dataset:
    cmd: python backend/data/pipeline.py && python backend/data/nfhs4_integration.py
    deps:
      - backend/data/pipeline.py
      - backend/data/nfhs4_integration.py
      - dataset/NFHS_5_India_Districts_Factsheet_Data_datafile.csv
      - dataset/NFHS-4_NFHS3_Factsheet-All_India_Indicators_R1.csv
    outs:
      - backend/data/nfhs5_clean.parquet
      - backend/data/nfhs5_clean.csv
      - backend/data/nfhs5_with_trends.parquet
      - backend/data/nfhs5_with_trends.csv
      - backend/data/schema.json
      - backend/data/district_summaries.json
    # trend_analysis_summary.json is deliberately left out here and stays plain
    # git-tracked instead — it's a small, human-readable summary, not something
    # that benefits from DVC's large-file handling, and staying in git keeps it
    # visible in normal diffs.

  build_index:
    cmd: python backend/vector_store/build_index.py
    deps:
      - backend/vector_store/build_index.py
      - backend/data/district_summaries.json
    outs:
      - backend/vector_store/chroma_db

# benchmark_questions.json is deliberately NOT a pipeline stage. Running
# generate_benchmark.py alone only produces 119 of the real 200 questions — the
# rest come from also running generate_remaining_questions.py, which picks
# districts/domains with unseeded random.choice() and so isn't reproducible run
# to run. (add_final_questions.py, a third script in the repo root, turns out to
# be unused — 119 + 81 already equals 200.) Since the real file can't be
# regenerated byte-for-byte from code, it's tracked directly as data via
# `dvc add` instead of pretending it's a deterministic pipeline output.
